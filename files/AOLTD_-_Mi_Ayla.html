<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>AOLTD: Mi Ayla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,600&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#AEE3F5;
  --sky-deep:#5FB8E0;
  --navy:#0B1E3D;
  --navy-deep:#061225;
  --gold:#F4D58D;
  --gold-deep:#D9AE52;
  --blush:#F0C6E0;
  --white:#FFFFFF;
  --glass: rgba(174,227,245,0.08);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none;}
body{
  font-family:'Quicksand', sans-serif;
  background: radial-gradient(ellipse at 50% -10%, #16305c 0%, var(--navy) 45%, var(--navy-deep) 100%);
  color:var(--white);
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
}
#stars-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.star-pt{position:absolute;background:var(--white);border-radius:50%;opacity:.7;animation:twinkle 3s ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.8);}50%{opacity:1;transform:scale(1.3);}}
#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px 60px;}

h1,h2,h3{font-family:'Playfair Display', serif; margin:0;}
.eyebrow{
  font-family:'Quicksand';
  letter-spacing:.35em;
  text-transform:uppercase;
  font-size:11px;
  color:var(--gold);
  opacity:.85;
}
.btn{
  font-family:'Quicksand';
  font-weight:700;
  font-size:15px;
  letter-spacing:.03em;
  padding:14px 32px;
  border-radius:40px;
  border:1.5px solid var(--gold);
  background:linear-gradient(180deg, rgba(244,213,141,.18), rgba(244,213,141,.05));
  color:var(--gold);
  cursor:pointer;
  transition:transform .15s ease, box-shadow .25s ease, background .25s ease;
  box-shadow:0 0 0 rgba(244,213,141,0);
}
.btn:active{transform:scale(.96);}
.btn:hover{box-shadow:0 0 24px rgba(244,213,141,.35); background:linear-gradient(180deg, rgba(244,213,141,.3), rgba(244,213,141,.08));}
.btn.primary{background:linear-gradient(180deg,var(--sky),var(--sky-deep)); color:var(--navy-deep); border:none; font-weight:700;}
.btn.primary:hover{box-shadow:0 0 24px rgba(174,227,245,.5);}
.btn:disabled{opacity:.35; pointer-events:none;}

.card{
  background:linear-gradient(160deg, rgba(174,227,245,.09), rgba(255,255,255,.02));
  border:1px solid rgba(244,213,141,.28);
  border-radius:22px;
  backdrop-filter:blur(6px);
  box-shadow:0 8px 40px rgba(0,0,0,.35);
}

/* ---------- SPLASH ---------- */
#splash{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:88vh;text-align:center;gap:18px;}
.crescent{width:70px;height:70px;border-radius:50%;
  box-shadow: -22px 0 0 4px var(--gold) inset;
  transform: rotate(-25deg);
  margin-bottom:6px;
  animation: float 4s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0) rotate(-25deg);}50%{transform:translateY(-10px) rotate(-25deg);}}
#splash h1{font-size:42px; background:linear-gradient(180deg,#fff, var(--sky));-webkit-background-clip:text;background-clip:text;color:transparent; line-height:1.15;}
#splash .sub{color:var(--sky); font-size:15px; max-width:320px; opacity:.9; line-height:1.6;}
.sparkline{width:120px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:6px 0;}

/* ---------- MAP ---------- */
#map-wrap{width:100%; max-width:480px;}
#map-header{text-align:center; margin-bottom:6px;}
#map-header h2{font-size:26px; color:var(--white);}
#progress-track{height:6px;border-radius:10px;background:rgba(255,255,255,.1);overflow:hidden;margin:14px auto 6px;max-width:280px;}
#progress-fill{height:100%;background:linear-gradient(90deg,var(--sky),var(--gold));width:0%;transition:width .6s ease;}
#progress-label{text-align:center;font-size:12px;color:var(--gold);letter-spacing:.1em;margin-bottom:18px;}
#constellation{position:relative; width:100%; height:610px; margin-top:10px;}
svg#lines{position:absolute;inset:0;width:100%;height:100%;}
.node{
  position:absolute; width:64px; height:64px; border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  transform:translate(-50%,-50%);
  cursor:pointer;
  transition:transform .2s ease;
}
.node:active{transform:translate(-50%,-50%) scale(.92);}
.node .dot{
  width:52px;height:52px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:'Playfair Display'; font-weight:700; font-size:18px;
  border:1.5px solid rgba(244,213,141,.4);
  background:rgba(255,255,255,.04);
  color:rgba(255,255,255,.35);
}
.node.unlocked .dot{
  border-color:var(--gold);
  background:radial-gradient(circle at 35% 30%, rgba(244,213,141,.55), rgba(174,227,245,.15));
  color:var(--navy-deep);
  color:#fff;
  box-shadow:0 0 18px rgba(244,213,141,.55);
  animation:pulseGlow 2.4s ease-in-out infinite;
}
.node.done .dot{
  background:radial-gradient(circle at 35% 30%, var(--gold), var(--gold-deep));
  color:var(--navy-deep);
  border-color:var(--gold);
  box-shadow:0 0 22px rgba(244,213,141,.8);
  animation:none;
}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 14px rgba(244,213,141,.4);}50%{box-shadow:0 0 26px rgba(244,213,141,.85);}}
.node .lbl{position:absolute; top:68px; width:120px; left:50%; transform:translateX(-50%); text-align:center; font-size:10.5px; color:var(--sky); letter-spacing:.03em; line-height:1.3;}
.node.locked .lbl{color:rgba(255,255,255,.3);}
.line-path{stroke:rgba(244,213,141,.18); stroke-width:2; fill:none; stroke-dasharray:4 6;}
.line-path.lit{stroke:var(--gold); stroke-dasharray:none; opacity:.7;}
#final-node .dot{width:74px;height:74px; font-size:26px;}

/* ---------- LEVEL MODAL ---------- */
#level-screen{position:fixed; inset:0; z-index:20; background:linear-gradient(180deg, var(--navy-deep), var(--navy) 60%); display:flex; flex-direction:column; align-items:center; padding:18px 16px 30px; overflow-y:auto;}
#level-top{width:100%; max-width:480px; display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
#level-top .back{font-family:'Quicksand'; color:var(--sky); font-size:14px; cursor:pointer; opacity:.85;}
#level-top .title{font-family:'Playfair Display'; font-size:17px; color:var(--gold);}
#level-body{width:100%; max-width:480px; flex:1; display:flex; flex-direction:column; align-items:center;}
.instructions{font-size:13.5px; color:var(--sky); text-align:center; line-height:1.6; margin-bottom:16px; max-width:360px;}
.hud{display:flex; gap:22px; justify-content:center; margin-bottom:14px; font-size:13px; color:var(--gold); font-weight:700; letter-spacing:.05em;}

/* Star Catch */
#catch-area{position:relative; width:100%; max-width:380px; height:420px; border-radius:18px; overflow:hidden; background:linear-gradient(180deg, rgba(174,227,245,.08), rgba(6,18,37,.4)); border:1px solid rgba(244,213,141,.25);}
.falling{position:absolute; font-size:38px; cursor:pointer; user-select:none; filter:drop-shadow(0 0 6px rgba(244,213,141,.6));}

/* Memory */
#memGrid{display:grid; grid-template-columns:repeat(4,1fr); gap:9px; width:100%; max-width:360px;}
.mcard{aspect-ratio:1; border-radius:12px; background:linear-gradient(160deg, rgba(174,227,245,.14), rgba(255,255,255,.02)); border:1px solid rgba(244,213,141,.3); display:flex; align-items:center; justify-content:center; font-size:26px; cursor:pointer; transition:transform .3s;}
.mcard.flipped{background:radial-gradient(circle at 35% 30%, rgba(244,213,141,.35), rgba(174,227,245,.1));}
.mcard.matched{opacity:.35; pointer-events:none;}

/* Unscramble */
#scramble-word{font-family:'Playfair Display'; font-size:34px; letter-spacing:.12em; color:var(--gold); margin:22px 0 18px; text-align:center;}
#scramble-input{width:100%; max-width:280px; padding:14px 18px; border-radius:30px; border:1.5px solid var(--gold); background:rgba(255,255,255,.06); color:#fff; font-family:'Quicksand'; font-size:16px; text-align:center; letter-spacing:.1em; outline:none;}
#scramble-input:focus{box-shadow:0 0 16px rgba(244,213,141,.4);}
.hint{font-size:12px; color:var(--sky); opacity:.75; margin-top:10px;}

/* Quiz */
.quiz-q{font-family:'Playfair Display'; font-size:19px; text-align:center; margin:8px 0 20px; line-height:1.4; color:#fff;}
.quiz-opts{display:flex; flex-direction:column; gap:10px; width:100%; max-width:340px;}
.quiz-opt{padding:14px 18px; border-radius:16px; border:1px solid rgba(244,213,141,.35); background:rgba(255,255,255,.04); color:var(--sky); font-family:'Quicksand'; font-size:14.5px; text-align:left; cursor:pointer; transition:.2s;}
.quiz-opt:active,.quiz-opt.chosen{background:rgba(244,213,141,.2); border-color:var(--gold); color:#fff;}
.quiz-feedback{margin-top:16px; text-align:center; font-size:13.5px; color:var(--gold); min-height:20px;}

/* Slice */
#slice-area{position:relative; width:100%; max-width:380px; height:420px; border-radius:18px; overflow:hidden; background:linear-gradient(180deg, rgba(174,227,245,.08), rgba(6,18,37,.4)); border:1px solid rgba(244,213,141,.25);}
.slice-item{position:absolute; font-size:44px; cursor:pointer;}

/* Racing */
#road{position:relative; width:100%; max-width:300px; height:440px; margin:0 auto; border-radius:18px; overflow:hidden; background:repeating-linear-gradient(180deg, #1b2a44 0 40px, #16233a 40px 80px); border:1px solid rgba(244,213,141,.25);}
.lane-line{position:absolute; top:0; bottom:0; width:2px; background:repeating-linear-gradient(180deg, rgba(255,255,255,.35) 0 16px, transparent 16px 32px);}
.car{position:absolute; bottom:14px; font-size:34px; transition:left .16s ease;}
.obst{position:absolute; font-size:28px;}
#road-controls{display:flex; gap:60px; margin-top:16px;}
.pad{width:64px;height:64px;border-radius:50%;border:1.5px solid var(--gold);background:rgba(244,213,141,.08);color:var(--gold);font-size:24px;display:flex;align-items:center;justify-content:center;}

/* Whack */
#whackGrid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; width:100%; max-width:300px;}
.hole{aspect-ratio:1; border-radius:50%; background:radial-gradient(circle at 40% 30%, rgba(174,227,245,.12), rgba(6,18,37,.5)); border:1px solid rgba(244,213,141,.25); display:flex; align-items:center; justify-content:center; font-size:0; cursor:pointer; overflow:hidden;}
.hole.up{font-size:30px;}

/* Constellation connect */
#connectSvg{width:100%; max-width:340px; height:420px;}
.cpoint{fill:rgba(255,255,255,.5); stroke:var(--gold); stroke-width:1.5; cursor:pointer;}
.cpoint.done{fill:var(--gold);}
.cline{stroke:var(--gold); stroke-width:2.5; fill:none; opacity:.9;}

/* Letter */
#letter-card{max-width:420px; padding:30px 26px; text-align:left;}
#letter-card p{font-size:14.5px; line-height:1.9; color:#EAF6FC; font-family:'Quicksand'; margin:0 0 14px;}
#letter-card .sign{font-family:'Playfair Display'; font-style:italic; color:var(--gold); font-size:16px; text-align:right; margin-top:6px;}

/* Finale */
#finale{min-height:88vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:18px; width:100%;}
#giftbox{font-size:90px; cursor:pointer; animation:float 3s ease-in-out infinite; filter:drop-shadow(0 0 20px rgba(244,213,141,.5));}
#finale h1{font-size:46px; background:linear-gradient(180deg,#fff,var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent;}
#lyricPanel{
  width:92%; max-width:360px; height:150px; overflow-y:auto;
  margin-top:4px; padding:10px 6px; scroll-behavior:auto;
  -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 14%, #000 86%, transparent 100%);
  mask-image:linear-gradient(to bottom, transparent 0, #000 14%, #000 86%, transparent 100%);
}
#lyricPanel::-webkit-scrollbar{width:3px;}
#lyricPanel::-webkit-scrollbar-thumb{background:rgba(244,213,141,.4); border-radius:4px;}
.lyric-section{font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--gold); opacity:.6; margin:14px 0 6px;}
.lyric-line{font-family:'Playfair Display'; font-style:italic; font-size:16px; line-height:1.7; margin:2px 0; opacity:.4; transition:opacity .3s, color .3s;}
.lyric-line .tag{font-family:'Quicksand'; font-style:normal; font-weight:700; font-size:9.5px; letter-spacing:.08em; color:var(--sky); opacity:.7; margin-right:6px; border:1px solid rgba(174,227,245,.4); border-radius:20px; padding:1px 6px;}
.lyric-line.near{opacity:.75; color:#fff;}
.lyric-line.active{opacity:1; color:var(--gold);}
.scrollhint{font-size:10.5px; color:var(--sky); opacity:.6; margin-top:2px;}
#photoStrip{display:flex; gap:10px; overflow-x:auto; max-width:100%; padding:10px 4px;}
#photoStrip img, .photo-ph{width:110px; height:140px; object-fit:cover; border-radius:14px; border:1.5px solid var(--gold); flex-shrink:0;}
.photo-ph{display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.05); color:var(--sky); font-size:11px; text-align:center; padding:8px;}
audio{width:90%; max-width:340px; margin-top:6px; filter: invert(0.85) sepia(1) saturate(2) hue-rotate(160deg);}

.confetti{position:fixed; top:-10px; z-index:30; pointer-events:none; font-size:20px; animation:fallC linear forwards;}
@keyframes fallC{to{transform:translateY(110vh) rotate(360deg); opacity:0;}}

@media (max-width:380px){
  #constellation{height:680px;}
  .node{width:56px;height:56px;}
  .node .dot{width:46px;height:46px;font-size:16px;}
}

/* ---------- SOUND TOGGLE ---------- */
#soundToggle{position:fixed; top:14px; right:14px; z-index:50; width:40px; height:40px; border-radius:50%; border:1.5px solid rgba(244,213,141,.4); background:rgba(6,18,37,.55); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; font-size:17px; cursor:pointer;}

/* ---------- TUTORIAL MODAL ---------- */
#tutorialOverlay{position:fixed; inset:0; z-index:60; background:rgba(6,18,37,.82); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; padding:24px;}
#tutorialModal{max-width:340px; padding:26px 22px; text-align:center;}
#tutorialModal .eyebrow{margin-bottom:8px;}
#tutorialModal h3{font-size:19px; color:var(--gold); margin-bottom:12px;}
#tutorialModal p{font-size:13.5px; line-height:1.7; color:var(--sky); margin:0 0 18px;}
.tts-note{font-size:10.5px; color:rgba(174,227,245,.55); margin-top:-10px; margin-bottom:16px;}

/* Quiz correctness */
.quiz-opt.correct{background:rgba(120,220,150,.22); border-color:#78dc96; color:#fff;}
.quiz-opt.wrong{background:rgba(230,110,110,.22); border-color:#e66e6e; color:#fff; animation:shakeX .35s ease;}
@keyframes shakeX{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}

/* Slice bad-hit flash */
.slice-item.bad-hit{animation:badFlash .3s ease forwards;}
@keyframes badFlash{0%{filter:brightness(1);}50%{filter:brightness(2.4) saturate(2);}100%{opacity:0; transform:scale(1.5);}}
#slice-area.penalty, #road.penalty{animation:screenFlash .35s ease;}
@keyframes screenFlash{0%{box-shadow:inset 0 0 0 rgba(230,80,80,0);}50%{box-shadow:inset 0 0 60px rgba(230,80,80,.65);}100%{box-shadow:inset 0 0 0 rgba(230,80,80,0);}}

/* Whack jitter */
.hole.up .star-el{display:inline-block; animation:holeJitter 1.4s ease-in-out infinite;}
@keyframes holeJitter{0%,100%{transform:translate(0,0);}25%{transform:translate(3px,-2px);}50%{transform:translate(-2px,2px);}75%{transform:translate(2px,2px);}}

/* Connect the heart HUD */
.connect-hud{display:flex; gap:20px; justify-content:center; margin-bottom:10px; font-size:12.5px; color:var(--gold); font-weight:700;}
.cpoint.next-hint{animation:hintPulse 1.1s ease-in-out infinite;}
@keyframes hintPulse{0%,100%{r:3.2;}50%{r:5;}}
.cpoint.miss{fill:#e66e6e;}

/* Letter reveal */
#letter-card p{opacity:0; max-height:0; overflow:hidden; margin:0; transition:opacity .6s ease, max-height .6s ease, margin .6s ease;}
#letter-card p.revealed{opacity:1; max-height:220px; margin:0 0 14px;}
.letter-tap-btn{margin-top:6px;}
.letter-tap-btn.hidden{display:none;}

/* Gift chest taps */
#giftbox{transition:transform .25s ease;}
#giftbox.tap1{animation:chestShake .4s ease;}
#giftbox.tap2{animation:chestGlow .5s ease;}
@keyframes chestShake{0%,100%{transform:rotate(0);}20%{transform:rotate(-8deg) scale(1.05);}40%{transform:rotate(8deg) scale(1.05);}60%{transform:rotate(-6deg) scale(1.08);}80%{transform:rotate(6deg) scale(1.08);}}
@keyframes chestGlow{0%{filter:drop-shadow(0 0 20px rgba(244,213,141,.5));}50%{filter:drop-shadow(0 0 55px rgba(244,213,141,1)) brightness(1.3);transform:scale(1.15);}100%{filter:drop-shadow(0 0 20px rgba(244,213,141,.5));}}
#giftTapHint{font-size:12px; color:var(--sky); opacity:.8; margin-top:4px;}
</style>
</head>
<body>
<div id="stars-bg"></div>
<div id="app"></div>

<script>
/* ============ STAR FIELD BACKGROUND ============ */
(function(){
  const bg = document.getElementById('stars-bg');
  const n = 70;
  for(let i=0;i<n;i++){
    const s = document.createElement('div');
    s.className='star-pt';
    const size = Math.random()*2.4+1;
    s.style.width=size+'px'; s.style.height=size+'px';
    s.style.left=Math.random()*100+'%';
    s.style.top=Math.random()*100+'%';
    s.style.animationDelay=(Math.random()*3)+'s';
    s.style.animationDuration=(2+Math.random()*3)+'s';
    bg.appendChild(s);
  }
})();

/* ============ SOUND ENGINE (synth SFX + soft BGM, no extra files needed) ============ */
const Sound = (function(){
  let ctx=null, bgmGain=null, bgmNodes=[], muted=false, started=false;
  function ensureCtx(){
    if(!ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(AC) ctx = new AC();
    }
    if(ctx && ctx.state==='suspended') ctx.resume();
    return ctx;
  }
  function sfx(type){
    if(muted) return;
    const c = ensureCtx();
    if(!c) return;
    const now = c.currentTime;
    const o = c.createOscillator();
    const g = c.createGain();
    o.connect(g); g.connect(c.destination);
    let freq=440, dur=.18, wave='sine', peak=.09;
    if(type==='tap'){ freq=520; dur=.09; wave='sine'; peak=.06; }
    if(type==='success'){ freq=660; dur=.35; wave='triangle'; peak=.1; }
    if(type==='fail'){ freq=180; dur=.28; wave='sawtooth'; peak=.08; }
    if(type==='star'){ freq=880; dur=.15; wave='sine'; peak=.07; }
    if(type==='whoosh'){ freq=300; dur=.4; wave='sine'; peak=.05; }
    if(type==='chest'){ freq=440; dur=.5; wave='triangle'; peak=.12; }
    o.type=wave; o.frequency.setValueAtTime(freq, now);
    if(type==='success'||type==='chest') o.frequency.exponentialRampToValueAtTime(freq*1.8, now+dur);
    if(type==='fail') o.frequency.exponentialRampToValueAtTime(freq*.6, now+dur);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(peak, now+.02);
    g.gain.exponentialRampToValueAtTime(0.0001, now+dur);
    o.start(now); o.stop(now+dur+.05);
  }
  function startBGM(){
    const c = ensureCtx();
    if(!c || started) return;
    started = true;
    bgmGain = c.createGain();
    bgmGain.gain.value = muted?0:0.035;
    bgmGain.connect(c.destination);
    const notes = [261.63, 329.63, 392.00, 440.00]; // soft C-E-G-A pad
    notes.forEach((f,i)=>{
      const o = c.createOscillator();
      const g = c.createGain();
      o.type='sine'; o.frequency.value=f;
      g.gain.value = 0.5/(i+1.5);
      o.connect(g); g.connect(bgmGain);
      o.start();
      bgmNodes.push(o);
    });
  }
  function setMuted(m){
    muted = m;
    if(bgmGain) bgmGain.gain.value = muted?0:0.035;
  }
  return {
    sfx,
    start(){ ensureCtx(); startBGM(); },
    toggleMute(){ setMuted(!muted); return muted; },
    isMuted(){ return muted; }
  };
})();

function initSoundToggle(){
  if(document.getElementById('soundToggle')) return;
  const btn = document.createElement('div');
  btn.id='soundToggle';
  btn.textContent='🔊';
  btn.onclick = ()=>{
    const m = Sound.toggleMute();
    btn.textContent = m ? '🔈' : '🔊';
  };
  document.body.appendChild(btn);
}

/* ============ TTS (Web Speech API — free, built into the browser) ============ */
function speak(text, opts){
  opts = opts||{};
  if(!('speechSynthesis' in window)) return false;
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = opts.rate || 0.95;
    u.pitch = opts.pitch || 1;
    u.volume = Sound.isMuted() ? 0 : 1;
    window.speechSynthesis.speak(u);
    return true;
  }catch(e){ return false; }
}

/* ============ TUTORIAL MODAL ============ */
const TUTORIALS = {
  catch: "Tap the falling stars before they reach the bottom. Catch fifteen to win, but watch out, they fall fast.",
  memory: "Flip two cards at a time and find every matching pair.",
  scramble: "Unscramble each set of letters. It is someone you know very well.",
  quiz: "Answer honestly, as her. Some questions test how well you both remember your story together, so choose carefully.",
  slice: "Only tap the hearts. Stars and clouds are traps, they will cost you two seconds each, so be quick and be careful.",
  race: "Steer the ufo left and right. Dodge the barriers and collect fourteen stars. Hitting a barrier costs you two seconds.",
  whack: "Tap the star anywhere on its circle the moment it appears. It moves and vanishes fast, so stay sharp.",
  connect: "Tap the glowing points in order to trace her heart before the time runs out.",
  letter: "Tap to reveal the letter, one piece at a time.",
  finale: "One last gift is waiting. Tap it three times to open it."
};
function showTutorial(lv, onStart){
  let overlay = document.createElement('div');
  overlay.id='tutorialOverlay';
  overlay.innerHTML = `
    <div class="card" id="tutorialModal">
      <div class="eyebrow">Level ${lv.id}</div>
      <h3>${lv.name.replace('\\n',' ')}</h3>
      <p>${TUTORIALS[lv.type]||'Get ready.'}</p>
      <div class="tts-note" id="ttsNote"></div>
      <button class="btn primary" id="tutorialStart">Let's Play ✨</button>
    </div>`;
  document.body.appendChild(overlay);
  Sound.start();
  const spoke = speak(TUTORIALS[lv.type]||'Get ready.');
  if(!spoke){ document.getElementById('ttsNote').textContent = '(voice narration unavailable on this device)'; }
  document.getElementById('tutorialStart').onclick = ()=>{
    if('speechSynthesis' in window) window.speechSynthesis.cancel();
    overlay.remove();
    onStart();
  };
}

function burstConfetti(count=40){
  const emojis=['✨','⭐','💙','🩵','🎉'];
  for(let i=0;i<count;i++){
    const c=document.createElement('div');
    c.className='confetti';
    c.textContent=emojis[Math.floor(Math.random()*emojis.length)];
    c.style.left=Math.random()*100+'vw';
    c.style.animationDuration=(2.2+Math.random()*2)+'s';
    c.style.fontSize=(14+Math.random()*14)+'px';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 4500);
  }
}

/* ============ STATE ============ */
const LEVELS = [
  {id:1, name:"Catch the Stars", icon:"⭐", type:"catch"},
  {id:2, name:"Memory of Us", icon:"🌙", type:"memory"},
  {id:3, name:"Unscramble", icon:"🔤", type:"scramble"},
  {id:4, name:"Getting to Know\nMy Luna", icon:"💌", type:"quiz"},
  {id:5, name:"Slice the Sky", icon:"🍓", type:"slice"},
  {id:6, name:"Moonlight Drive", icon:"🛸", type:"race"},
  {id:7, name:"Whack-a-Star", icon:"✨", type:"whack"},
  {id:8, name:"Trace the Heart", icon:"💙", type:"connect"},
  {id:9, name:"The Letter", icon:"💌", type:"letter"},
  {id:10, name:"The Ultimate Gift", icon:"🎁", type:"finale"},
];

let state = {
  unlocked: 1, // highest unlocked level
  completed: {},
};

function markComplete(id){
  state.completed[id]=true;
  if(state.unlocked === id && id < LEVELS.length){
    state.unlocked = id+1;
  }
}

/* ============ ROUTER ============ */
const app = document.getElementById('app');

function renderSplash(){
  app.innerHTML = `
  <div id="splash">
    <div class="eyebrow">AOLTD Presents</div>
    <div class="crescent"></div>
    <h1>Mi Ayla</h1>
    <div class="sparkline"></div>
    <div class="sub">A little universe made just for Luna.<br>Ten stars to catch. One gift waiting at the end.</div>
    <div style="height:10px"></div>
    <button class="btn primary" onclick="goMap()">Begin the Journey ✨</button>
  </div>`;
  initSoundToggle();
}

function goMap(){ Sound.start(); Sound.sfx('whoosh'); renderMap(); }

function renderMap(){
  const doneCount = Object.keys(state.completed).length;
  const pct = Math.round((doneCount/LEVELS.length)*100);

  // positions for a gentle vertical constellation path (percent based)
  const positions = [
    [22,6],[70,14],[30,24],[74,34],[24,44],[70,54],[26,64],[72,74],[26,88],[64,99]
  ];

  let nodesHtml = '';
  let pathPts = [];
  LEVELS.forEach((lv,i)=>{
    const [x,y] = positions[i];
    pathPts.push([x,y]);
    const isDone = state.completed[lv.id];
    const isUnlocked = lv.id <= state.unlocked;
    const cls = isDone ? 'done' : (isUnlocked ? 'unlocked':'locked');
    nodesHtml += `
      <div class="node ${cls}" id="${lv.id===10?'final-node':''}" style="left:${x}%; top:${y}%;" onclick="${isUnlocked?`openLevel(${lv.id})`:''}">
        <div class="dot">${isDone?'★':lv.icon}</div>
        <div class="lbl">${lv.id}. ${lv.name.replace('\\n','<br>')}</div>
      </div>`;
  });

  // svg lines connecting points
  let lines = '';
  for(let i=0;i<pathPts.length-1;i++){
    const [x1,y1]=pathPts[i], [x2,y2]=pathPts[i+1];
    const lit = LEVELS[i+1].id <= state.unlocked;
    lines += `<path class="line-path ${lit?'lit':''}" d="M ${x1} ${y1} Q ${(x1+x2)/2+ (i%2===0?8:-8)} ${(y1+y2)/2} ${x2} ${y2}" vector-effect="non-scaling-stroke"/>`;
  }

  app.innerHTML = `
  <div id="map-wrap">
    <div id="map-header">
      <div class="eyebrow">Your Constellation</div>
      <h2>Mi Ayla</h2>
    </div>
    <div id="progress-track"><div id="progress-fill" style="width:${pct}%"></div></div>
    <div id="progress-label">${doneCount} / ${LEVELS.length} STARS COLLECTED</div>
    <div id="constellation">
      <svg id="lines" viewBox="0 0 100 100" preserveAspectRatio="none">${lines}</svg>
      ${nodesHtml}
    </div>
  </div>`;
}

function openLevel(id){
  const lv = LEVELS.find(l=>l.id===id);
  const renderers = {
    catch: renderCatch,
    memory: renderMemory,
    scramble: renderScramble,
    quiz: renderQuiz,
    slice: renderSlice,
    race: renderRace,
    whack: renderWhack,
    connect: renderConnect,
    letter: renderLetter,
    finale: renderFinale,
  };
  showTutorial(lv, ()=>{
    renderLevelShell(lv);
    renderers[lv.type](lv);
  });
}

function renderLevelShell(lv){
  let shell = document.getElementById('level-screen');
  if(!shell){
    shell = document.createElement('div');
    shell.id='level-screen';
    document.body.appendChild(shell);
  }
  shell.innerHTML = `
    <div id="level-top">
      <div class="back" onclick="closeLevel()">← Map</div>
      <div class="title">${lv.id}. ${lv.name.replace('\\n',' ')}</div>
      <div style="width:40px"></div>
    </div>
    <div id="level-body"></div>`;
}
function closeLevel(){
  const shell = document.getElementById('level-screen');
  if(shell) shell.remove();
  clearAllTimers();
  renderMap();
}
function completeAndReturn(id, msg){
  markComplete(id);
  const body = document.getElementById('level-body');
  if(body){
    body.innerHTML += `<div style="margin-top:22px; text-align:center;">
      <div style="font-size:34px;">⭐</div>
      <div style="color:var(--gold); font-family:'Playfair Display'; font-size:18px; margin:8px 0;">${msg||'Star collected!'}</div>
      <button class="btn primary" onclick="closeLevel()">Back to the Sky</button>
    </div>`;
  }
  burstConfetti(24);
}

let timers = [];
function clearAllTimers(){ timers.forEach(t=>clearInterval(t)); timers=[]; }

/* ============ LEVEL 1: CATCH THE STARS ============ */
function renderCatch(lv){
  const body = document.getElementById('level-body');
  const target = 15;
  let score = 0, timeLeft = 40, spawner, ticker;
  body.innerHTML = `
    <div class="instructions">Tap the falling stars before they disappear. Catch ${target} to win the star.</div>
    <div class="hud"><span id="catchScore">Stars: 0</span><span id="catchTime">Time: ${timeLeft}s</span></div>
    <div id="catch-area"></div>`;
  const area = document.getElementById('catch-area');

  spawner = setInterval(()=>{
    const el = document.createElement('div');
    el.className='falling';
    el.textContent = Math.random()<0.15 ? '🩵' : '⭐';
    const left = Math.random()*85;
    el.style.left = left+'%';
    el.style.top = '-30px';
    area.appendChild(el);
    const dur = 1250 + Math.random()*650;
    let start=null;
    function fall(ts){
      if(!start) start=ts;
      const p=(ts-start)/dur;
      if(p>=1){ el.remove(); return; }
      el.style.top = (p*440-30)+'px';
      requestAnimationFrame(fall);
    }
    requestAnimationFrame(fall);
    el.onclick = ()=>{
      score++;
      Sound.sfx('star');
      document.getElementById('catchScore').textContent = 'Stars: '+score;
      el.remove();
      if(score>=target){
        clearInterval(spawner); clearInterval(ticker);
        Sound.sfx('success');
        completeAndReturn(lv.id, "You caught every star, Luna ✨");
      }
    };
  }, 950);
  timers.push(spawner);

  ticker = setInterval(()=>{
    timeLeft--;
    const t = document.getElementById('catchTime');
    if(t) t.textContent = 'Time: '+timeLeft+'s';
    if(timeLeft<=0){
      clearInterval(spawner); clearInterval(ticker);
      if(score>=target){
        Sound.sfx('success');
        completeAndReturn(lv.id, "You caught every star, Luna ✨");
      } else {
        Sound.sfx('fail');
        body.innerHTML += `<div style="text-align:center;margin-top:18px;">
          <div style="color:var(--sky);margin-bottom:10px;">So close — try again, this sky isn't going anywhere.</div>
          <button class="btn" onclick="openLevel(${lv.id})">Try Again</button>
        </div>`;
      }
    }
  },1000);
  timers.push(ticker);
}

/* ============ LEVEL 2: MEMORY ============ */
function renderMemory(lv){
  const body = document.getElementById('level-body');
  const icons = ['🌙','⭐','💙','🎵','🚗','💌','👑','🦋'];
  let deck = [...icons, ...icons].sort(()=>Math.random()-0.5);
  body.innerHTML = `
    <div class="instructions">Flip the cards and find every matching pair.</div>
    <div id="memGrid"></div>`;
  const grid = document.getElementById('memGrid');
  let flipped = [], matched = 0, lock=false;
  deck.forEach((icon, idx)=>{
    const c = document.createElement('div');
    c.className='mcard';
    c.dataset.icon = icon;
    c.dataset.idx = idx;
    c.textContent='';
    c.onclick=()=>{
      if(lock || c.classList.contains('flipped') || c.classList.contains('matched')) return;
      Sound.sfx('tap');
      c.classList.add('flipped');
      c.textContent = icon;
      flipped.push(c);
      if(flipped.length===2){
        lock = true;
        setTimeout(()=>{
          if(flipped[0].dataset.icon === flipped[1].dataset.icon){
            flipped.forEach(f=>f.classList.add('matched'));
            matched++;
            Sound.sfx('star');
            if(matched===icons.length){
              Sound.sfx('success');
              completeAndReturn(lv.id, "Every memory found, my Luna 🌙");
            }
          } else {
            Sound.sfx('fail');
            flipped.forEach(f=>{f.classList.remove('flipped'); f.textContent='';});
          }
          flipped=[]; lock=false;
        }, 650);
      }
    };
    grid.appendChild(c);
  });
}

/* ============ LEVEL 3: UNSCRAMBLE ============ */
function renderScramble(lv){
  const body = document.getElementById('level-body');
  const words = ['LUNA','AYLA','WIFEY','ALPHA','MIAYLA'];
  let i = 0;
  function scramble(w){
    let a = w.split('');
    do{ a.sort(()=>Math.random()-0.5); } while(a.join('')===w && w.length>1);
    return a.join(' ');
  }
  function normalize(s){
    return s.trim().toUpperCase().replace(/\s+/g,'');
  }
  function show(){
    const w = words[i];
    body.innerHTML = `
      <div class="instructions">Unscramble the word. It's someone you know very well 💙</div>
      <div class="hud"><span>Word ${i+1} / ${words.length}</span></div>
      <div id="scramble-word">${scramble(w)}</div>
      <input id="scramble-input" placeholder="type your answer" autocomplete="off" autocapitalize="characters">
      <div class="hint">${w.length} letters</div>
      <div id="scramble-fb" style="margin-top:14px;color:var(--gold);font-size:13px;"></div>`;
    const inp = document.getElementById('scramble-input');
    inp.focus();
    inp.addEventListener('keydown', e=>{
      if(e.key==='Enter') check();
    });
    function check(){
      if(normalize(inp.value) === w){
        Sound.sfx('star');
        i++;
        if(i>=words.length){
          Sound.sfx('success');
          completeAndReturn(lv.id, "You know exactly who she is ⭐");
        } else {
          show();
        }
      } else {
        Sound.sfx('fail');
        document.getElementById('scramble-fb').textContent = 'Not quite — try again 💭';
      }
    }
  }
  show();
}

/* ============ LEVEL 4: QUIZ ============ */
function renderQuiz(lv){
  const body = document.getElementById('level-body');
  // NOTE FROM AOLTD: swap the placeholder q/opts/correct below for your real
  // "only she'd know" trivia — a specific scene from a movie you both watched,
  // the actual chorus line of a song that's "yours", an inside detail from
  // your story. `correct` is the index (0-based) of the right option.
  const qs = [
    {q:"In the movie you both watched together, what happens in the scene everyone remembers most?", opts:["They finally kiss in the rain","They have the big fight and walk away","They dance together at the party","They say goodbye at the airport"], correct:0},
    {q:"What's the actual chorus line of \"your\" song?", opts:["Mi Ayla, mi Ayla — birthday queen, birthday maker","Baby girl, you're my whole world tonight","Luna, Luna, shining over me","Forever yours, forever mine"], correct:0},
    {q:"Where was your very first real date?", opts:["Somewhere you both still talk about","A place neither of you remembers","Nowhere, you've never been on one","A restaurant you both hated"], correct:0},
    {q:"What's the one thing AOLTD always says to you?", opts:["Something only the two of you would know","Nothing in particular","A line from a movie","A song lyric, always the same one"], correct:0},
  ];
  let i=0, wrongCount=0;
  function show(){
    const item = qs[i];
    body.innerHTML = `
      <div class="hud"><span>Question ${i+1} / ${qs.length}</span></div>
      <div class="quiz-q">${item.q}</div>
      <div class="quiz-opts" id="qopts"></div>
      <div class="quiz-feedback" id="qfb"></div>`;
    const optsWrap = document.getElementById('qopts');
    item.opts.forEach((o,oi)=>{
      const b = document.createElement('div');
      b.className='quiz-opt';
      b.textContent = o;
      b.onclick=()=>{
        if(b.classList.contains('locked')) return;
        if(oi===item.correct){
          document.querySelectorAll('.quiz-opt').forEach(x=>x.classList.add('locked'));
          b.classList.add('correct');
          Sound.sfx('star');
          document.getElementById('qfb').textContent = pickGood();
          setTimeout(()=>{
            i++;
            if(i>=qs.length){
              Sound.sfx('success');
              completeAndReturn(lv.id, "Whoever she is tonight — she's loved, and she remembers everything 💙");
            } else {
              show();
            }
          }, 850);
        } else {
          b.classList.add('wrong');
          Sound.sfx('fail');
          wrongCount++;
          document.getElementById('qfb').textContent = pickBad();
          setTimeout(()=>b.classList.remove('wrong'), 400);
        }
      };
      optsWrap.appendChild(b);
    });
  }
  const goods = ["Exactly right 💫","That's the one 🌙","Perfect memory ✨","Couldn't be more right 💙"];
  const bads = ["Hmm, not quite — think again 💭","That's not it, try once more","Close, but no — one more guess"];
  function pickGood(){ return goods[Math.floor(Math.random()*goods.length)]; }
  function pickBad(){ return bads[Math.floor(Math.random()*bads.length)]; }
  show();
}

/* ============ LEVEL 5: SLICE ============ */
function renderSlice(lv){
  const body = document.getElementById('level-body');
  const target = 15;
  let score = 0, timeLeft = 40, spawner, ticker, ended=false;
  body.innerHTML = `
    <div class="instructions">Only tap the hearts 💙. Stars ⭐ and clouds ☁️ are traps — each one costs 2 seconds. Slice ${target} hearts to win.</div>
    <div class="hud"><span id="sliceScore">Sliced: 0</span><span id="sliceTime">Time: ${timeLeft}s</span></div>
    <div id="slice-area"></div>`;
  const area = document.getElementById('slice-area');

  function endNow(){
    if(ended) return;
    ended = true;
    clearInterval(spawner); clearInterval(ticker);
    if(score>=target){
      Sound.sfx('success');
      completeAndReturn(lv.id, "The whole sky, sliced with love 🍓");
    } else {
      Sound.sfx('fail');
      body.innerHTML += `<div style="text-align:center;margin-top:18px;">
        <div style="color:var(--sky);margin-bottom:10px;">Almost! One more round.</div>
        <button class="btn" onclick="openLevel(${lv.id})">Try Again</button></div>`;
    }
  }

  spawner = setInterval(()=>{
    if(ended) return;
    const el = document.createElement('div');
    el.className='slice-item';
    const roll = Math.random();
    const isGood = roll < 0.45; // heart
    el.textContent = isGood ? '💙' : (Math.random()<0.5 ? '⭐' : '☁️');
    el.style.left = (Math.random()*76)+'%';
    el.style.top = (Math.random()*76)+'%';
    area.appendChild(el);
    const life = setTimeout(()=>el.remove(), 1250);
    el.onclick = ()=>{
      if(ended) return;
      clearTimeout(life);
      if(!isGood){
        el.classList.add('bad-hit');
        Sound.sfx('fail');
        timeLeft = Math.max(0, timeLeft-2);
        const t=document.getElementById('sliceTime');
        if(t) t.textContent='Time: '+timeLeft+'s';
        area.classList.remove('penalty'); void area.offsetWidth; area.classList.add('penalty');
        setTimeout(()=>el.remove(),260);
        if(timeLeft<=0) endNow();
      } else {
        Sound.sfx('star');
        score++;
        document.getElementById('sliceScore').textContent='Sliced: '+score;
        el.remove();
        if(score>=target) endNow();
      }
    };
  }, 700);
  timers.push(spawner);
  ticker = setInterval(()=>{
    if(ended) return;
    timeLeft--;
    const t=document.getElementById('sliceTime');
    if(t) t.textContent='Time: '+timeLeft+'s';
    if(timeLeft<=0) endNow();
  },1000);
  timers.push(ticker);
}

/* ============ LEVEL 6: RACE ============ */
function renderRace(lv){
  const body = document.getElementById('level-body');
  const lanes = [20,50,80]; // percent
  const target = 14;
  let laneIdx = 1, score=0, timeLeft=40, spawner, ticker, moveLoop, ended=false;
  body.innerHTML = `
    <div class="instructions">Dodge the traffic barriers 🚧, collect ${target} stars. Hitting a barrier costs 2 seconds.</div>
    <div class="hud"><span id="raceScore">Stars: 0 / ${target}</span><span id="raceTime">Time: ${timeLeft}s</span></div>
    <div id="road">
      <div class="lane-line" style="left:33%"></div>
      <div class="lane-line" style="left:66%"></div>
      <div class="car" id="car" style="left:calc(${lanes[1]}% - 17px)">🛸</div>
    </div>
    <div id="road-controls">
      <div class="pad" id="leftPad">◀</div>
      <div class="pad" id="rightPad">▶</div>
    </div>`;
  const car = document.getElementById('car');
  function setLane(i){
    laneIdx = Math.max(0, Math.min(2,i));
    car.style.left = `calc(${lanes[laneIdx]}% - 17px)`;
  }
  document.getElementById('leftPad').onclick=()=>setLane(laneIdx-1);
  document.getElementById('rightPad').onclick=()=>setLane(laneIdx+1);
  function keyHandler(e){
    if(e.key==='ArrowLeft') setLane(laneIdx-1);
    if(e.key==='ArrowRight') setLane(laneIdx+1);
  }
  document.addEventListener('keydown', keyHandler);

  const road = document.getElementById('road');
  const objs = [];

  function endRace(){
    if(ended) return;
    ended = true;
    clearInterval(spawner); clearInterval(moveLoop); clearInterval(ticker);
    document.removeEventListener('keydown', keyHandler);
    if(score>=target){
      Sound.sfx('success');
      completeAndReturn(lv.id, "Made it through the night — every star collected 🛸✨");
    } else {
      Sound.sfx('fail');
      body.innerHTML += `<div style="text-align:center;margin-top:18px;">
        <div style="color:var(--sky);margin-bottom:10px;">Almost there — one more flight through the sky.</div>
        <button class="btn" onclick="openLevel(${lv.id})">Try Again</button></div>`;
    }
  }

  spawner = setInterval(()=>{
    if(ended) return;
    const li = Math.floor(Math.random()*3);
    const isStar = Math.random()<0.45;
    const el = document.createElement('div');
    el.className='obst';
    el.textContent = isStar? '⭐' : '🚧';
    el.style.left = `calc(${lanes[li]}% - 14px)`;
    el.style.top = '-30px';
    el.dataset.lane = li;
    el.dataset.star = isStar?'1':'0';
    road.appendChild(el);
    objs.push(el);
  }, 750);
  timers.push(spawner);

  moveLoop = setInterval(()=>{
    if(ended) return;
    for(let k=objs.length-1;k>=0;k--){
      const el = objs[k];
      const top = parseFloat(el.style.top)+18;
      el.style.top = top+'px';
      if(top>380 && top<420 && parseInt(el.dataset.lane)===laneIdx){
        if(el.dataset.star==='1'){
          score++;
          Sound.sfx('star');
          document.getElementById('raceScore').textContent='Stars: '+score+' / '+target;
          if(score>=target){ el.remove(); objs.splice(k,1); endRace(); return; }
        } else {
          Sound.sfx('fail');
          timeLeft = Math.max(0, timeLeft-2);
          const t=document.getElementById('raceTime');
          if(t) t.textContent='Time: '+timeLeft+'s';
          road.classList.remove('penalty'); void road.offsetWidth; road.classList.add('penalty');
          if(timeLeft<=0){ el.remove(); objs.splice(k,1); endRace(); return; }
        }
        el.remove(); objs.splice(k,1);
        continue;
      }
      if(top>440){ el.remove(); objs.splice(k,1); }
    }
  }, 60);
  timers.push(moveLoop);

  ticker = setInterval(()=>{
    if(ended) return;
    timeLeft--;
    const t=document.getElementById('raceTime');
    if(t) t.textContent='Time: '+timeLeft+'s';
    if(timeLeft<=0) endRace();
  },1000);
  timers.push(ticker);
}

/* ============ LEVEL 7: WHACK ============ */
function renderWhack(lv){
  const body = document.getElementById('level-body');
  const target = 15;
  let score=0, timeLeft=30, spawner, ticker, ended=false, activeHole=null, vanishTimer=null;
  body.innerHTML = `
    <div class="instructions">Tap anywhere on the star's circle the moment it appears. It moves and vanishes fast. Reach ${target} points.</div>
    <div class="hud"><span id="whackScore">Score: 0</span><span id="whackTime">Time: ${timeLeft}s</span></div>
    <div id="whackGrid"></div>`;
  const grid = document.getElementById('whackGrid');
  const holes = [];
  for(let i=0;i<9;i++){
    const h = document.createElement('div');
    h.className='hole';
    grid.appendChild(h);
    holes.push(h);
    // whole-circle collision: every hole gets its own permanent listener
    h.addEventListener('click', ()=>{
      if(ended || h!==activeHole || !h.classList.contains('up')) return;
      score++;
      Sound.sfx('star');
      document.getElementById('whackScore').textContent='Score: '+score;
      hideActive();
      if(score>=target){
        clearInterval(spawner); clearInterval(ticker);
        Sound.sfx('success');
        completeAndReturn(lv.id, "Quick hands, quicker heart ✨");
      }
    });
  }

  function hideActive(){
    if(activeHole){
      activeHole.classList.remove('up');
      activeHole.innerHTML='';
      activeHole = null;
    }
    clearTimeout(vanishTimer);
  }

  spawner = setInterval(()=>{
    if(ended) return;
    hideActive();
    const h = holes[Math.floor(Math.random()*holes.length)];
    activeHole = h;
    h.classList.add('up');
    h.innerHTML = '<span class="star-el">⭐</span>';
    vanishTimer = setTimeout(hideActive, 430); // vanishes quickly, before next spawn
  }, 600);
  timers.push(spawner);
  ticker = setInterval(()=>{
    timeLeft--;
    const t=document.getElementById('whackTime');
    if(t) t.textContent='Time: '+timeLeft+'s';
    if(timeLeft<=0){
      ended = true;
      clearInterval(spawner); clearInterval(ticker);
      hideActive();
      if(score>=target){
        Sound.sfx('success');
        completeAndReturn(lv.id, "Quick hands, quicker heart ✨");
      } else {
        Sound.sfx('fail');
        body.innerHTML += `<div style="text-align:center;margin-top:18px;">
          <div style="color:var(--sky);margin-bottom:10px;">So close! One more try.</div>
          <button class="btn" onclick="openLevel(${lv.id})">Try Again</button></div>`;
      }
    }
  },1000);
  timers.push(ticker);
}

/* ============ LEVEL 8: CONNECT THE HEART ============ */
function renderConnect(lv){
  const body = document.getElementById('level-body');
  // heart-shaped points, order matters
  const pts = [
    [50,15],[35,5],[15,15],[8,35],[20,55],[50,80],[80,55],[92,35],[85,15],[65,5],[50,15]
  ];
  let timeLeft = 25, misses = 0, ticker, ended=false;
  body.innerHTML = `
    <div class="instructions">Tap the glowing points in order, 1 to ${pts.length-1}, to trace her heart before time runs out.</div>
    <div class="connect-hud"><span id="connTime">Time: ${timeLeft}s</span><span id="connMiss">Misses: 0</span></div>
    <svg id="connectSvg" viewBox="0 0 100 90">
      <path id="litPath" class="cline" d="" />
    </svg>`;
  const svg = document.getElementById('connectSvg');
  let next = 0;
  const circles = [];
  pts.forEach((p,idx)=>{
    if(idx===pts.length-1) return; // last point duplicates first, used only for closing line
    const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx', p[0]); c.setAttribute('cy', p[1]); c.setAttribute('r', 3.2);
    c.classList.add('cpoint');
    c.dataset.idx = idx;
    svg.appendChild(c);
    circles.push(c);
    c.addEventListener('click', ()=>{
      if(ended) return;
      if(idx===next){
        Sound.sfx('star');
        c.classList.remove('next-hint');
        c.classList.add('done');
        next++;
        const path = document.getElementById('litPath');
        let d = 'M '+pts[0][0]+' '+pts[0][1];
        for(let k=1;k<=idx+1 && k<pts.length;k++){
          d += ' L '+pts[k][0]+' '+pts[k][1];
        }
        path.setAttribute('d', d);
        updateHint();
        if(next>=pts.length-1){
          ended = true;
          clearInterval(ticker);
          Sound.sfx('success');
          setTimeout(()=>completeAndReturn(lv.id, "Her heart, fully traced 💙"), 400);
        }
      } else if(!c.classList.contains('done')){
        misses++;
        Sound.sfx('fail');
        document.getElementById('connMiss').textContent = 'Misses: '+misses;
        c.classList.add('miss');
        setTimeout(()=>c.classList.remove('miss'), 300);
      }
    });
  });
  function updateHint(){
    circles.forEach(c=>c.classList.remove('next-hint'));
    if(circles[next]) circles[next].classList.add('next-hint');
  }
  updateHint();
  ticker = setInterval(()=>{
    if(ended) return;
    timeLeft--;
    const t = document.getElementById('connTime');
    if(t) t.textContent = 'Time: '+timeLeft+'s';
    if(timeLeft<=0){
      ended = true;
      clearInterval(ticker);
      Sound.sfx('fail');
      body.innerHTML += `<div style="text-align:center;margin-top:18px;">
        <div style="color:var(--sky);margin-bottom:10px;">So close — her heart wants one more try.</div>
        <button class="btn" onclick="openLevel(${lv.id})">Try Again</button></div>`;
    }
  }, 1000);
  timers.push(ticker);
}

  const body = document.getElementById('level-body');
  const paras = [
    "Hey mi ayla",
    "I just want to say I'm truly sorry for what happened. I know I may have hurt you, disappointed you, or made you feel like I didn't care enough, and I want you to know that was never my intention. I've been thinking about everything, and I realize that I should have handled things differently.",
    "You mean so much to me, and the last thing I ever want is for you to feel unhappy because of me. I appreciate your patience, your love, your time, and all the little things you do that make me feel special. I don't want one mistake or one bad moment to make you forget how much I value you.",
    "I'm not going to just say sorry and repeat the same thing again. I want my actions to show you that I'm serious about making things better. I want to listen more, understand you more, and be someone who brings you happiness instead of pain.",
    "I miss the way we laugh, talk, and enjoy being together. Having you in my life is something I'm grateful for, and I don't want to take you for granted. You are important to me, and I hope you can forgive me and give me a chance to make things right.",
    "Thank you for being patient with me even when I'm not perfect. I'm still learning, but I promise I'm trying to become better, not just for myself, but for us.",
    "I'm really sorry — I hope we can move forward together and create even more beautiful memories."
  ];
  body.innerHTML = `
    <div class="card" id="letter-card">
      <div class="eyebrow" style="margin-bottom:10px;">A note that mattered once</div>
      ${paras.map((p,i)=>`<p data-i="${i}">${p}</p>`).join('')}
      <div class="sign" id="letterSign" style="display:none;">— always, AOLTD</div>
    </div>
    <button class="btn" id="letterTapBtn" style="margin-top:18px;">Tap to reveal 💫</button>
    <button class="btn primary letter-tap-btn hidden" id="letterDoneBtn" onclick="completeAndReturn(${lv.id}, 'Some words age like stars — they only get brighter 💙')">I remember this 💙</button>`;
  const pEls = Array.from(document.querySelectorAll('#letter-card p'));
  let shown = 0;
  function revealNext(){
    if(shown>=pEls.length) return;
    pEls[shown].classList.add('revealed');
    Sound.sfx('tap');
    shown++;
    if(shown>=pEls.length){
      document.getElementById('letterSign').style.display='';
      document.getElementById('letterTapBtn').classList.add('hidden');
      document.getElementById('letterDoneBtn').classList.remove('hidden');
      Sound.sfx('success');
    }
  }
  document.getElementById('letterTapBtn').onclick = revealNext;
  revealNext();
}

/* ============ LEVEL 10: FINALE ============ */
let giftTaps = 0;
function renderFinale(lv){
  const body = document.getElementById('level-body');
  giftTaps = 0;
  body.innerHTML = `
    <div id="finale">
      <div class="eyebrow">Every star led here</div>
      <div id="giftbox" onclick="tapGift()">🎁</div>
      <div style="color:var(--sky); font-size:13px;" id="giftTapHint">Tap the gift, Luna</div>
    </div>`;
}
function tapGift(){
  giftTaps++;
  const box = document.getElementById('giftbox');
  const hint = document.getElementById('giftTapHint');
  box.classList.remove('tap1','tap2');
  if(giftTaps===1){
    box.classList.add('tap1');
    Sound.sfx('chest');
    hint.textContent = 'It shook a little... tap again';
  } else if(giftTaps===2){
    box.classList.add('tap2');
    Sound.sfx('chest');
    hint.textContent = "It's glowing now... one more tap";
  } else if(giftTaps>=3){
    Sound.sfx('chest');
    box.onclick = null;
    hint.textContent = '';
    openGift();
  }
}

function buildLyricHtml(){
  let html = '';
  let flatIdx = 0;
  const flatMap = [];
  LYRIC_SECTIONS.forEach(sec=>{
    html += `<div class="lyric-section">${sec.section}</div>`;
    sec.lines.forEach(l=>{
      html += `<div class="lyric-line" data-i="${flatIdx}">${l.tag?`<span class="tag">${l.tag}</span>`:''}${l.text}</div>`;
      flatMap.push(l);
      flatIdx++;
    });
  });
  return {html, total: flatIdx, flatMap};
}

function openGift(){
  burstConfetti(60);
  const box = document.getElementById('giftbox');
  box.style.transition='transform .4s ease, opacity .4s ease';
  box.style.transform='scale(1.6) rotate(15deg)';
  box.style.opacity='0';
  // Optional: a spoken confession + proposal, played only if the browser
  // supports free built-in text-to-speech. If not available, the reveal
  // just proceeds silently — this line is never required for the gift to work.
  speak("Mi Ayla, before you see this, I need you to hear it too. Every star tonight was for you. I love you, more than any of these games could ever show. So, mi Ayla... will you marry me?", {rate:0.88});
  setTimeout(()=>{
    const finale = document.getElementById('finale');
    const {html: lyricsHtml, total: lyricCount, flatMap: lyricFlatMap} = buildLyricHtml();
    finale.innerHTML = `
      <div class="eyebrow">Happy 21st, Luna</div>
      <h1>Mi Ayla</h1>
      <div class="sparkline"></div>
      <audio id="songPlayer" controls preload="auto">
        <source src="assets/song.mp3" type="audio/mpeg">

        you are the ultimate gift, always.
      </p>
      <div style="color:var(--gold); font-family:'Playfair Display'; font-style:italic; font-size:15px; margin-top:4px;">
        — AOLTD
      </div>`;
    const player = document.getElementById('songPlayer');
    const panel = document.getElementById('lyricPanel');
    const lineEls = Array.from(panel.querySelectorAll('.lyric-line'));
    let userScrolling = false, userScrollTimeout = null, programmaticScroll = false;

    panel.addEventListener('scroll', ()=>{
      if(programmaticScroll){ programmaticScroll=false; return; }
      userScrolling = true;
      clearTimeout(userScrollTimeout);
      userScrollTimeout = setTimeout(()=>{ userScrolling = false; }, 4000);
    });

    const flatTimes = lyricFlatMap.map(l=>l.t);
    player.addEventListener('timeupdate', ()=>{
      const now = player.currentTime;
      let idx = 0;
      for(let k=0;k<flatTimes.length;k++){
        if(flatTimes[k] <= now) idx = k; else break;
      }
      lineEls.forEach((el,i)=>{
        el.classList.remove('active','near');
        if(i===idx) el.classList.add('active');
        else if(Math.abs(i-idx)===1) el.classList.add('near');
      });
      if(!userScrolling && lineEls[idx]){
        programmaticScroll = true;
        const target = lineEls[idx].offsetTop - panel.clientHeight/2 + 12;
        panel.scrollTop = Math.max(0, target);
      }
    });
    markComplete(10);
  }, 450);
}
