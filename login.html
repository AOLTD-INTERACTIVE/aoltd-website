<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AOLTD GATE · Login / Register</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Foldit:wght@400;600;700&family=Aubrey&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --orange: #ff5500;
            --dark-blue: #0a1929;
            --text-light: #ffffff;
            --text-dim: #b0b0b0;
            --card-bg: rgba(20, 30, 45, 0.85);
            --gradient-1: linear-gradient(135deg, #ff5500, #ff3300);
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            --error-red: #ff4d4d;
            --success-green: #4cff9e;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #0a1929;
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(circle at 10% 20%, rgba(255,85,0,0.08) 0%, rgba(10,25,41,0.95) 90%);
            padding: 2rem;
        }

        .auth-container {
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
        }

        .auth-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 40px;
            border: 1px solid rgba(255, 85, 0, 0.35);
            box-shadow: var(--shadow);
            padding: 2.5rem 2rem;
            transition: all 0.3s ease;
        }

        .aoltd-logo {
            font-family: 'Foldit', cursive;
            font-size: 3rem;
            font-weight: 700;
            color: var(--orange);
            letter-spacing: 4px;
            text-align: center;
            text-shadow: 0 0 8px rgba(255,85,0,0.5);
        }

        .form-title {
            font-size: 2rem;
            font-weight: 700;
            margin: 1rem 0 0.5rem;
            text-align: center;
            background: var(--gradient-1);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .sub {
            text-align: center;
            color: var(--text-dim);
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--orange);
        }

        .auth-input {
            width: 100%;
            background: rgba(10, 25, 41, 0.8);
            border: 2px solid rgba(255, 85, 0, 0.3);
            border-radius: 60px;
            padding: 0.9rem 1.5rem;
            font-size: 1rem;
            color: var(--text-light);
            transition: all 0.25s ease;
        }

        .auth-input:focus {
            outline: none;
            border-color: var(--orange);
            box-shadow: 0 0 0 3px rgba(255, 85, 0, 0.2);
        }

        .auth-btn {
            width: 100%;
            background: var(--gradient-1);
            border: none;
            padding: 1rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1.2rem;
            color: white;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 12px rgba(255, 85, 0, 0.4);
        }

        .auth-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(255, 85, 0, 0.5);
        }

        .auth-btn:disabled {
            opacity: 0.7;
            transform: none;
            cursor: not-allowed;
        }

        .switch-link {
            text-align: center;
            margin-top: 1.8rem;
            font-size: 0.9rem;
            color: var(--text-dim);
        }

        .switch-link a {
            color: var(--orange);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 1px dashed rgba(255,85,0,0.4);
        }

        .switch-link a:hover {
            color: #ff7733;
        }

        .message-box {
            background: rgba(0,0,0,0.6);
            border-radius: 60px;
            padding: 0.75rem 1.2rem;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
            text-align: center;
            border-left: 4px solid var(--orange);
        }

        .error-msg {
            color: var(--error-red);
            border-left-color: var(--error-red);
        }

        .success-msg {
            color: var(--success-green);
            border-left-color: var(--success-green);
        }

        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-badge {
            font-size: 0.7rem;
            text-align: center;
            margin-top: 1rem;
            padding: 0.3rem;
            border-radius: 20px;
            background: rgba(0,0,0,0.3);
            cursor: pointer;
        }

        .retry-btn {
            background: rgba(255,85,0,0.3);
            border: 1px solid var(--orange);
            border-radius: 20px;
            padding: 0.2rem 0.8rem;
            margin-left: 0.5rem;
            cursor: pointer;
            font-size: 0.7rem;
        }

        .retry-btn:hover {
            background: rgba(255,85,0,0.6);
        }

        @media (max-width: 550px) {
            .auth-card { padding: 1.8rem; }
            .aoltd-logo { font-size: 2.3rem; }
            .form-title { font-size: 1.6rem; }
        }
    </style>
</head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <div class="aoltd-logo">AOLTD</div>
        <div class="form-title" id="form-title">ENTER THE GRID</div>
        <div class="sub" id="sub-text">Your cube awaits identity</div>

        <div id="message-area" class="message-box" style="display: none;"></div>
        
        <!-- PlayFab connection status -->
        <div id="status-badge" class="status-badge">
            <span id="status-text">⏳ Loading PlayFab SDK...</span>
            <span id="retry-button" class="retry-btn" style="display: none;">⟳ Retry</span>
        </div>

        <!-- LOGIN FORM -->
        <form id="login-form" style="display: none;">
            <div class="input-group">
                <label>⚡ USERNAME / EMAIL</label>
                <input type="text" id="login-username" class="auth-input" placeholder="username or email@example.com">
            </div>
            <div class="input-group">
                <label>🔒 PASSWORD</label>
                <input type="password" id="login-password" class="auth-input" placeholder="••••••••">
            </div>
            <button type="submit" class="auth-btn" id="login-btn">⟡ LOGIN ⟡</button>
            <div class="switch-link">
                No account? <a id="goto-register">Forge your legend →</a>
            </div>
        </form>

        <!-- REGISTER FORM -->
        <form id="register-form" style="display: none;">
            <div class="input-group">
                <label>✨ USERNAME</label>
                <input type="text" id="reg-username" class="auth-input" placeholder="Choose a legendary name">
            </div>
            <div class="input-group">
                <label>📧 EMAIL</label>
                <input type="email" id="reg-email" class="auth-input" placeholder="your@email.com">
            </div>
            <div class="input-group">
                <label>🔐 PASSWORD</label>
                <input type="password" id="reg-password" class="auth-input" placeholder="minimum 6 characters">
            </div>
            <div class="input-group">
                <label>✓ CONFIRM PASSWORD</label>
                <input type="password" id="reg-confirm" class="auth-input" placeholder="same as above">
            </div>
            <button type="submit" class="auth-btn" id="register-btn">🐉 REGISTER & PLAY 🐉</button>
            <div class="switch-link">
                Already a cube master? <a id="goto-login">Back to Login →</a>
            </div>
        </form>

        <div class="status-badge" style="margin-top: 1rem; font-size: 0.65rem; cursor: default;">
            🐲 Title ID: 17CD1B
        </div>
    </div>
</div>

<script>
    // ==================== MULTI-CDN PLAYFAB LOADER ====================
    const TITLE_ID = "17CD1B";
    let playfabReady = false;
    let sdkLoadAttempts = 0;
    const maxAttempts = 3;
    
    // CDN sources to try
    const cdnSources = [
        "https://cdn.playfab.com/sdk/2023-12-11/PlayFabClientApi.js",
        "https://playfab.com/sdk/2023-12-11/PlayFabClientApi.js",
        "https://unpkg.com/playfab-web-sdk@latest/PlayFabClientApi.js"
    ];
    
    // DOM elements
    const msgDiv = document.getElementById('message-area');
    const statusSpan = document.getElementById('status-text');
    const retryBtn = document.getElementById('retry-button');
    const loginForm = document.getElementById('login-form');
    const registerForm = document.getElementById('register-form');
    const formTitle = document.getElementById('form-title');
    const subText = document.getElementById('sub-text');
    
    function showMessage(text, isError = true) {
        msgDiv.style.display = 'block';
        msgDiv.innerHTML = text;
        msgDiv.className = `message-box ${isError ? 'error-msg' : 'success-msg'}`;
        setTimeout(() => {
            if (msgDiv.style.display === 'block' && msgDiv.innerHTML === text) {
                msgDiv.style.opacity = '0';
                setTimeout(() => {
                    if (msgDiv.innerHTML === text) msgDiv.style.display = 'none';
                    msgDiv.style.opacity = '';
                }, 300);
            }
        }, 6000);
    }
    
    function clearMessage() {
        msgDiv.style.display = 'none';
    }
    
    function setButtonLoading(button, isLoading, originalText) {
        if (isLoading) {
            button.disabled = true;
            button.innerHTML = `<span class="loading-spinner"></span> ${originalText || 'Processing...'}`;
        } else {
            button.disabled = false;
            button.innerHTML = originalText;
        }
    }
    
    function updateStatus(text, isError = false, showRetry = false) {
        statusSpan.innerHTML = text;
        if (isError) {
            statusSpan.style.color = "#ff6666";
        } else {
            statusSpan.style.color = "#ffaa44";
        }
        retryBtn.style.display = showRetry ? "inline-block" : "none";
    }
    
    function enableForms() {
        loginForm.style.display = 'block';
        registerForm.style.display = 'none';
        formTitle.innerHTML = 'ENTER THE GRID';
        subText.innerHTML = 'Your cube awaits identity';
    }
    
    // Load PlayFab SDK from specific URL
    function loadPlayFabFromUrl(url) {
        return new Promise((resolve, reject) => {
            const script = document.createElement('script');
            script.src = url;
            script.onload = () => {
                if (typeof PlayFab !== 'undefined' && PlayFab.settings) {
                    PlayFab.settings.titleId = TITLE_ID;
                    console.log(`PlayFab loaded from: ${url}`);
                    resolve(true);
                } else {
                    reject(new Error(`SDK loaded but PlayFab object not found from ${url}`));
                }
            };
            script.onerror = () => reject(new Error(`Failed to load from ${url}`));
            document.head.appendChild(script);
        });
    }
    
    // Try to load SDK from multiple CDNs
    async function loadPlayFabSDK() {
        updateStatus("⏳ Loading PlayFab SDK...");
        
        for (let i = 0; i < cdnSources.length; i++) {
            try {
                console.log(`Attempting to load from CDN ${i + 1}: ${cdnSources[i]}`);
                updateStatus(`⏳ Trying CDN ${i + 1}/${cdnSources.length}...`);
                await loadPlayFabFromUrl(cdnSources[i]);
                
                // Success! Test the connection
                updateStatus("✅ SDK loaded! Testing connection...");
                const connected = await testPlayFabConnection();
                if (connected) {
                    updateStatus("✅ PlayFab ready! You can login/register.", false);
                    playfabReady = true;
                    enableForms();
                    return true;
                }
            } catch (err) {
                console.warn(`CDN ${i + 1} failed:`, err.message);
                updateStatus(`⚠️ CDN ${i + 1} failed, trying next...`, true);
            }
        }
        
        updateStatus("❌ Could not load PlayFab SDK. Check your internet.", true, true);
        playfabReady = false;
        return false;
    }
    
    // Test connection to PlayFab servers
    async function testPlayFabConnection() {
        return new Promise((resolve) => {
            if (typeof PlayFab === 'undefined' || !PlayFab.settings) {
                resolve(false);
                return;
            }
            
            PlayFab.settings.titleId = TITLE_ID;
            
            // Simple ping to PlayFab
            PlayFabClientSDK.GetTitleData({
                Keys: []
            }, (error) => {
                if (error && error.error === "NotAuthenticated") {
                    // This means server responded! Connection works.
                    console.log("PlayFab server reachable");
                    resolve(true);
                } else if (!error) {
                    resolve(true);
                } else {
                    console.error("Connection test error:", error);
                    resolve(false);
                }
            });
        });
    }
    
    // ========== LOGIN ==========
    async function handleLogin(event) {
        event.preventDefault();
        clearMessage();
        
        if (!playfabReady) {
            showMessage("⏳ PlayFab not ready. Wait for connection or click retry.", true);
            return;
        }
        
        const loginBtn = document.getElementById('login-btn');
        const originalText = loginBtn.innerHTML;
        setButtonLoading(loginBtn, true, "⟡ AUTHENTICATING ⟡");
        
        const identifier = document.getElementById('login-username').value.trim();
        const password = document.getElementById('login-password').value.trim();
        
        if (!identifier || !password) {
            showMessage("⚠️ Both fields are required.", true);
            setButtonLoading(loginBtn, false, originalText);
            return;
        }
        
        const isEmail = identifier.includes('@') && identifier.includes('.');
        
        try {
            let result;
            if (isEmail) {
                result = await new Promise((resolve, reject) => {
                    PlayFabClientSDK.LoginWithEmailAddress({
                        TitleId: TITLE_ID,
                        Email: identifier,
                        Password: password
                    }, (err, res) => err ? reject(err) : resolve(res));
                });
            } else {
                result = await new Promise((resolve, reject) => {
                    PlayFabClientSDK.LoginWithPlayFab({
                        TitleId: TITLE_ID,
                        Username: identifier,
                        Password: password
                    }, (err, res) => err ? reject(err) : resolve(res));
                });
            }
            
            localStorage.setItem('AOLTD_session', result.data.SessionTicket);
            localStorage.setItem('AOLTD_playFabId', result.data.PlayFabId);
            
            showMessage(`✨ Welcome back! Login successful. Redirecting... ✨`, false);
            setButtonLoading(loginBtn, false, originalText);
            
            setTimeout(() => {
                window.location.href = "games/games.html";
            }, 1500);
            
        } catch (error) {
            console.error("Login error:", error);
            let errorMsg = "Login failed. ";
            if (error.errorMessage) errorMsg += error.errorMessage;
            else errorMsg += "Check credentials.";
            
            if (error.error === "InvalidUser") errorMsg = "❌ No account found. Register first!";
            else if (error.error === "InvalidPassword") errorMsg = "🔐 Incorrect password.";
            
            showMessage(errorMsg, true);
            setButtonLoading(loginBtn, false, originalText);
        }
    }
    
    // ========== REGISTER ==========
    async function handleRegister(event) {
        event.preventDefault();
        clearMessage();
        
        if (!playfabReady) {
            showMessage("⏳ PlayFab not ready. Please wait.", true);
            return;
        }
        
        const regBtn = document.getElementById('register-btn');
        const originalText = regBtn.innerHTML;
        setButtonLoading(regBtn, true, "🐉 FORGING ACCOUNT...");
        
        const username = document.getElementById('reg-username').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const password = document.getElementById('reg-password').value.trim();
        const confirm = document.getElementById('reg-confirm').value.trim();
        
        if (!username || !email || !password || !confirm) {
            showMessage("All fields are required.", true);
            setButtonLoading(regBtn, false, originalText);
            return;
        }
        
        if (password !== confirm) {
            showMessage("🔥 Passwords do not match!", true);
            setButtonLoading(regBtn, false, originalText);
            return;
        }
        
        if (password.length < 6) {
            showMessage("Password must be at least 6 characters.", true);
            setButtonLoading(regBtn, false, originalText);
            return;
        }
        
        if (!email.includes('@')) {
            showMessage("Enter a valid email address.", true);
            setButtonLoading(regBtn, false, originalText);
            return;
        }
        
        showMessage("⏳ Contacting PlayFab servers...", false);
        
        try {
            const result = await new Promise((resolve, reject) => {
                PlayFabClientSDK.RegisterPlayFabUser({
                    TitleId: TITLE_ID,
                    Username: username,
                    Email: email,
                    Password: password,
                    RequireBothUsernameAndEmail: true
                }, (error, result) => {
                    if (error) reject(error);
                    else resolve(result);
                });
            });
            
            showMessage(`🎉 Account created! Welcome ${username}! 🎉`, false);
            setButtonLoading(regBtn, false, originalText);
            
            setTimeout(() => {
                switchToLogin();
                document.getElementById('login-username').value = email;
                showMessage(`✨ Account created! Now login. ✨`, false);
            }, 1800);
            
        } catch (error) {
            console.error("Registration error:", error);
            let errorMsg = error.errorMessage || "Registration failed.";
            
            if (errorMsg.includes("UsernameNotAvailable")) {
                errorMsg = "⚠️ Username already taken. Try another.";
            } else if (errorMsg.includes("EmailAlreadyInUse")) {
                errorMsg = "📧 Email already registered.";
            } else if (errorMsg.includes("InvalidEmail")) {
                errorMsg = "📧 Invalid email format.";
            }
            
            showMessage(`❌ ${errorMsg}`, true);
            setButtonLoading(regBtn, false, originalText);
        }
    }
    
    // UI switching
    function switchToLogin() {
        loginForm.style.display = 'block';
        registerForm.style.display = 'none';
        formTitle.innerHTML = 'ENTER THE GRID';
        subText.innerHTML = 'Your cube awaits identity';
        clearMessage();
    }
    
    function switchToRegister() {
        loginForm.style.display = 'none';
        registerForm.style.display = 'block';
        formTitle.innerHTML = 'FORGE YOUR LEGEND';
        subText.innerHTML = 'create an account, join the tenacious';
        clearMessage();
    }
    
    // Retry loading
    function retryLoad() {
        updateStatus("🔄 Retrying SDK load...", false);
        retryBtn.style.display = "none";
        loadPlayFabSDK();
    }
    
    // Event listeners
    document.getElementById('goto-register').addEventListener('click', (e) => {
        e.preventDefault();
        switchToRegister();
    });
    document.getElementById('goto-login').addEventListener('click', (e) => {
        e.preventDefault();
        switchToLogin();
    });
    
    loginForm.addEventListener('submit', handleLogin);
    registerForm.addEventListener('submit', handleRegister);
    retryBtn.addEventListener('click', retryLoad);
    
    // Start loading SDK
    loadPlayFabSDK();
</script>
</body>
</html>
