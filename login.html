<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="favicon_io/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AOLTD GATE · Login / Register</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Foldit:wght@400;600;700&family=Aubrey&display=swap" rel="stylesheet">
    
    <!-- PlayFab SDK - using latest stable -->
    <script src="https://cdn.playfab.com/sdk/2023-12-11/PlayFabClientApi.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --orange: #ff5500;
            --dark-blue: #0a1929;
            --text-light: #ffffff;
            --text-dim: #b0b0b0;
            --card-bg: rgba(20, 30, 45, 0.85);
            --gradient-1: linear-gradient(135deg, #ff5500, #ff3300);
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            --error-red: #ff4d4d;
            --success-green: #4cff9e;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #0a1929;
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(circle at 10% 20%, rgba(255,85,0,0.08) 0%, rgba(10,25,41,0.95) 90%);
            padding: 2rem;
        }

        .auth-container {
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
        }

        .auth-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 40px;
            border: 1px solid rgba(255, 85, 0, 0.35);
            box-shadow: var(--shadow);
            padding: 2.5rem 2rem;
            transition: all 0.3s ease;
        }

        .aoltd-logo {
            font-family: 'Foldit', cursive;
            font-size: 3rem;
            font-weight: 700;
            color: var(--orange);
            letter-spacing: 4px;
            text-align: center;
            text-shadow: 0 0 8px rgba(255,85,0,0.5);
        }

        .form-title {
            font-size: 2rem;
            font-weight: 700;
            margin: 1rem 0 0.5rem;
            text-align: center;
            background: var(--gradient-1);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .sub {
            text-align: center;
            color: var(--text-dim);
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--orange);
        }

        .auth-input {
            width: 100%;
            background: rgba(10, 25, 41, 0.8);
            border: 2px solid rgba(255, 85, 0, 0.3);
            border-radius: 60px;
            padding: 0.9rem 1.5rem;
            font-size: 1rem;
            color: var(--text-light);
            transition: all 0.25s ease;
        }

        .auth-input:focus {
            outline: none;
            border-color: var(--orange);
            box-shadow: 0 0 0 3px rgba(255, 85, 0, 0.2);
        }

        .auth-btn {
            width: 100%;
            background: var(--gradient-1);
            border: none;
            padding: 1rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1.2rem;
            color: white;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 12px rgba(255, 85, 0, 0.4);
        }

        .auth-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(255, 85, 0, 0.5);
        }

        .auth-btn:disabled {
            opacity: 0.7;
            transform: none;
            cursor: not-allowed;
        }

        .switch-link {
            text-align: center;
            margin-top: 1.8rem;
            font-size: 0.9rem;
            color: var(--text-dim);
        }

        .switch-link a {
            color: var(--orange);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 1px dashed rgba(255,85,0,0.4);
        }

        .switch-link a:hover {
            color: #ff7733;
        }

        .message-box {
            background: rgba(0,0,0,0.6);
            border-radius: 60px;
            padding: 0.75rem 1.2rem;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
            text-align: center;
            border-left: 4px solid var(--orange);
        }

        .error-msg {
            color: var(--error-red);
            border-left-color: var(--error-red);
        }

        .success-msg {
            color: var(--success-green);
            border-left-color: var(--success-green);
        }

        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-badge {
            font-size: 0.7rem;
            text-align: center;
            margin-top: 1rem;
            padding: 0.3rem;
            border-radius: 20px;
            background: rgba(0,0,0,0.3);
        }

        @media (max-width: 550px) {
            .auth-card { padding: 1.8rem; }
            .aoltd-logo { font-size: 2.3rem; }
            .form-title { font-size: 1.6rem; }
        }
    </style>
</head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <div class="aoltd-logo">AOLTD</div>
        <div class="form-title" id="form-title">ENTER THE GRID</div>
        <div class="sub" id="sub-text">Your cube awaits identity</div>

        <div id="message-area" class="message-box" style="display: none;"></div>
        
        <!-- PlayFab connection status -->
        <div id="status-badge" class="status-badge" style="color: #ffaa44;">⏳ Checking PlayFab connection...</div>

        <!-- LOGIN FORM -->
        <form id="login-form">
            <div class="input-group">
                <label>⚡ USERNAME / EMAIL</label>
                <input type="text" id="login-username" class="auth-input" placeholder="username or email@example.com">
            </div>
            <div class="input-group">
                <label>🔒 PASSWORD</label>
                <input type="password" id="login-password" class="auth-input" placeholder="••••••••">
            </div>
            <button type="submit" class="auth-btn" id="login-btn">⟡ LOGIN ⟡</button>
            <div class="switch-link">
                No account? <a id="goto-register">Forge your legend →</a>
            </div>
        </form>

        <!-- REGISTER FORM -->
        <form id="register-form" style="display: none;">
            <div class="input-group">
                <label>✨ USERNAME</label>
                <input type="text" id="reg-username" class="auth-input" placeholder="Choose a legendary name">
            </div>
            <div class="input-group">
                <label>📧 EMAIL</label>
                <input type="email" id="reg-email" class="auth-input" placeholder="your@email.com">
            </div>
            <div class="input-group">
                <label>🔐 PASSWORD</label>
                <input type="password" id="reg-password" class="auth-input" placeholder="minimum 6 characters">
            </div>
            <div class="input-group">
                <label>✓ CONFIRM PASSWORD</label>
                <input type="password" id="reg-confirm" class="auth-input" placeholder="same as above">
            </div>
            <button type="submit" class="auth-btn" id="register-btn">🐉 REGISTER & PLAY 🐉</button>
            <div class="switch-link">
                Already a cube master? <a id="goto-login">Back to Login →</a>
            </div>
        </form>

        <div class="status-badge" style="margin-top: 1rem; font-size: 0.65rem;">
            🐲 Title ID: 17CD1B
        </div>
    </div>
</div>

<script>
    // ==================== PLAYFAB CONFIG ====================
    const TITLE_ID = "17CD1B";
    let playfabReady = false;
    
    // DOM elements
    const msgDiv = document.getElementById('message-area');
    const statusBadge = document.getElementById('status-badge');
    
    function showMessage(text, isError = true) {
        msgDiv.style.display = 'block';
        msgDiv.innerHTML = text;
        msgDiv.className = `message-box ${isError ? 'error-msg' : 'success-msg'}`;
        // Auto-hide after 6 seconds
        setTimeout(() => {
            if (msgDiv.style.display === 'block' && msgDiv.innerHTML === text) {
                msgDiv.style.opacity = '0';
                setTimeout(() => {
                    if (msgDiv.innerHTML === text) msgDiv.style.display = 'none';
                    msgDiv.style.opacity = '';
                }, 300);
            }
        }, 6000);
    }
    
    function clearMessage() {
        msgDiv.style.display = 'none';
    }
    
    function setButtonLoading(button, isLoading, originalText) {
        if (isLoading) {
            button.disabled = true;
            button.innerHTML = `<span class="loading-spinner"></span> ${originalText || 'Processing...'}`;
        } else {
            button.disabled = false;
            button.innerHTML = originalText;
        }
    }
    
    // ========== TEST PLAYFAB CONNECTION ==========
    async function testPlayFabConnection() {
        statusBadge.innerHTML = "⏳ Testing connection to PlayFab servers...";
        statusBadge.style.color = "#ffaa44";
        
        // First, initialize PlayFab settings
        if (typeof PlayFab !== 'undefined' && PlayFab.settings) {
            PlayFab.settings.titleId = TITLE_ID;
            console.log("PlayFab initialized with Title ID:", TITLE_ID);
        } else {
            statusBadge.innerHTML = "⚠️ PlayFab SDK not loaded. Check internet or try again.";
            statusBadge.style.color = "#ff6666";
            return false;
        }
        
        // Test API call - GetTitleData is a lightweight call to verify connection
        return new Promise((resolve) => {
            PlayFabClientSDK.GetTitleData({
                Keys: []  // empty keys, just testing connectivity
            }, (error, result) => {
                if (error) {
                    console.error("PlayFab connection test FAILED:", error);
                    let errorDetail = error.errorMessage || error.message || "Unknown error";
                    if (error.error === "NotAuthenticated") {
                        // This is actually GOOD - means server responded but we're not logged in
                        // So connection works!
                        statusBadge.innerHTML = "✅ PlayFab server reachable! Ready to login/register.";
                        statusBadge.style.color = "#4cff9e";
                        playfabReady = true;
                        resolve(true);
                    } else if (error.httpCode) {
                        statusBadge.innerHTML = `⚠️ HTTP ${error.httpCode}: ${errorDetail.substring(0, 60)}`;
                        statusBadge.style.color = "#ffaa44";
                        resolve(false);
                    } else {
                        statusBadge.innerHTML = `❌ Connection failed: ${errorDetail.substring(0, 80)}`;
                        statusBadge.style.color = "#ff6666";
                        resolve(false);
                    }
                } else {
                    // If it works, even better
                    statusBadge.innerHTML = "✅ PlayFab connected! Your game account is ready.";
                    statusBadge.style.color = "#4cff9e";
                    playfabReady = true;
                    resolve(true);
                }
            });
        });
    }
    
    // ========== LOGIN ==========
    async function handleLogin(event) {
        event.preventDefault();
        clearMessage();
        
        if (!playfabReady) {
            showMessage("⏳ PlayFab is still connecting. Please wait 2 seconds and try again.", true);
            return;
        }
        
        const loginBtn = document.getElementById('login-btn');
        const originalText = loginBtn.innerHTML;
        setButtonLoading(loginBtn, true, "⟡ AUTHENTICATING ⟡");
        
        const identifier = document.getElementById('login-username').value.trim();
        const password = document.getElementById('login-password').value.trim();
        
        if (!identifier || !password) {
            showMessage("⚠️ Both fields are required, brave adventurer.", true);
            setButtonLoading(loginBtn, false, originalText);
            return;
        }
        
        const isEmail = identifier.includes('@') && identifier.includes('.');
        
        try {
            let result;
            if (isEmail) {
                // Login with email
                result = await new Promise((resolve, reject) => {
                    PlayFabClientSDK.LoginWithEmailAddress({
                        TitleId: TITLE_ID,
                        Email: identifier,
                        Password: password
                    }, (err, res) => err ? reject(err) : resolve(res));
                });
            } else {
                // Login with username
                result = await new Promise((resolve, reject) => {
                    PlayFabClientSDK.LoginWithPlayFab({
                        TitleId: TITLE_ID,
                        Username: identifier,
                        Password: password
                    }, (err, res) => err ? reject(err) : resolve(res));
                });
            }
            
            // Success!
            localStorage.setItem('AOLTD_session', result.data.SessionTicket);
            localStorage.setItem('AOLTD_playFabId', result.data.PlayFabId);
            
            showMessage(`✨ Welcome back, ${identifier}! Login successful. Redirecting... ✨`, false);
            setButtonLoading(loginBtn, false, originalText);
            
            setTimeout(() => {
                window.location.href = "games/games.html";
            }, 1500);
            
        } catch (error) {
            console.error("Login error FULL:", error);
            let errorMsg = "Login failed. ";
            if (error.errorMessage) errorMsg += error.errorMessage;
            else if (error.message) errorMsg += error.message;
            else errorMsg += "Check credentials or network.";
            
            if (error.error === "InvalidUser") errorMsg = "❌ No account found with that username/email. Register first!";
            else if (error.error === "InvalidPassword") errorMsg = "🔐 Incorrect password. Try again.";
            
            showMessage(errorMsg, true);
            setButtonLoading(loginBtn, false, originalText);
        }
    }
    
    // ========== REGISTER ==========
    async function handleRegister(event) {
        event.preventDefault();
        clearMessage();
        
        if (!playfabReady) {
            showMessage("⏳ PlayFab is still connecting. Please wait 2 seconds and try again.", true);
            return;
        }
        
        const regBtn = document.getElementById('register-btn');
        const originalText = regBtn.innerHTML;
        setButtonLoading(regBtn, true, "🐉 FORGING ACCOUNT...");
        
        const username = document.getElementById('reg-username').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const password = document.getElementById('reg-password').value.trim();
        const confirm = document.getElementById('reg-confirm').value.trim();
        
        // Validation
        if (!username || !email || !password || !confirm) {
            showMessage("All fields are required, lone developer.", true);
            setButtonLoading(regBtn, false, originalText);
            return;
        }
        
        if (password !== confirm) {
            showMessage("🔥 Passwords do not match! The dragon demands consistency.", true);
            setButtonLoading(regBtn, false, originalText);
            return;
        }
        
        if (password.length < 6) {
            showMessage("Password must be at least 6 characters (security first!).", true);
            setButtonLoading(regBtn, false, originalText);
            return;
        }
        
        if (!email.includes('@') || !email.includes('.')) {
            showMessage("Enter a valid email address for dragon mail.", true);
            setButtonLoading(regBtn, false, originalText);
            return;
        }
        
        if (username.length < 3) {
            showMessage("Username must be at least 3 characters.", true);
            setButtonLoading(regBtn, false, originalText);
            return;
        }
        
        // Show "waiting" message so user knows something is happening
        showMessage("⏳ Contacting PlayFab servers... Please wait.", false);
        
        console.log("Attempting registration with:", { username, email, passwordLength: password.length });
        
        try {
            const result = await new Promise((resolve, reject) => {
                PlayFabClientSDK.RegisterPlayFabUser({
                    TitleId: TITLE_ID,
                    Username: username,
                    Email: email,
                    Password: password,
                    RequireBothUsernameAndEmail: true
                }, (error, result) => {
                    if (error) {
                        console.error("PlayFab registration ERROR:", error);
                        reject(error);
                    } else {
                        console.log("PlayFab registration SUCCESS:", result);
                        resolve(result);
                    }
                });
            });
            
            // Registration success!
            showMessage(`🎉 Account created! Welcome ${username}! Redirecting to login... 🎉`, false);
            setButtonLoading(regBtn, false, originalText);
            
            // Auto switch to login form and fill email
            setTimeout(() => {
                switchToLogin();
                document.getElementById('login-username').value = email;
                showMessage(`✨ Account created! Now login with your email or username. ✨`, false);
            }, 1800);
            
        } catch (error) {
            console.error("Registration error DETAILS:", error);
            
            let errorMsg = "";
            if (error.errorMessage) {
                errorMsg = error.errorMessage;
            } else if (error.message) {
                errorMsg = error.message;
            } else {
                errorMsg = "Registration failed. Check network or PlayFab settings.";
            }
            
            // Make errors more user-friendly
            if (errorMsg.includes("UsernameNotAvailable") || errorMsg.includes("username already")) {
                errorMsg = "⚠️ Username already taken. Try another legendary alias.";
            } else if (errorMsg.includes("EmailAlreadyInUse") || errorMsg.includes("email already")) {
                errorMsg = "📧 Email already registered. Did you forget your password?";
            } else if (errorMsg.includes("InvalidEmail")) {
                errorMsg = "📧 Invalid email format. Please use a real email address.";
            } else if (errorMsg.includes("network") || errorMsg.includes("fetch")) {
                errorMsg = "🌐 Network error. Check your internet connection and try again.";
            }
            
            showMessage(`❌ ${errorMsg}`, true);
            setButtonLoading(regBtn, false, originalText);
        }
    }
    
    // ========== UI SWITCHING ==========
    const loginForm = document.getElementById('login-form');
    const registerForm = document.getElementById('register-form');
    const formTitle = document.getElementById('form-title');
    const subText = document.getElementById('sub-text');
    
    function switchToLogin() {
        loginForm.style.display = 'block';
        registerForm.style.display = 'none';
        formTitle.innerHTML = 'ENTER THE GRID';
        subText.innerHTML = 'Your cube awaits identity';
        clearMessage();
        document.getElementById('login-username').value = '';
        document.getElementById('login-password').value = '';
    }
    
    function switchToRegister() {
        loginForm.style.display = 'none';
        registerForm.style.display = 'block';
        formTitle.innerHTML = 'FORGE YOUR LEGEND';
        subText.innerHTML = 'create an account, join the tenacious';
        clearMessage();
        document.getElementById('reg-username').value = '';
        document.getElementById('reg-email').value = '';
        document.getElementById('reg-password').value = '';
        document.getElementById('reg-confirm').value = '';
    }
    
    // Event listeners
    document.getElementById('goto-register').addEventListener('click', (e) => {
        e.preventDefault();
        switchToRegister();
    });
    document.getElementById('goto-login').addEventListener('click', (e) => {
        e.preventDefault();
        switchToLogin();
    });
    
    loginForm.addEventListener('submit', handleLogin);
    registerForm.addEventListener('submit', handleRegister);
    
    // ========== INITIALIZE ==========
    async function init() {
        // Set PlayFab title ID immediately
        if (typeof PlayFab !== 'undefined' && PlayFab.settings) {
            PlayFab.settings.titleId = TITLE_ID;
            console.log("PlayFab title ID set to:", TITLE_ID);
        } else {
            // Wait for SDK to load
            const checkSDK = setInterval(() => {
                if (typeof PlayFab !== 'undefined' && PlayFab.settings) {
                    PlayFab.settings.titleId = TITLE_ID;
                    console.log("PlayFab SDK loaded late, title ID set");
                    clearInterval(checkSDK);
                    testPlayFabConnection();
                }
            }, 200);
            setTimeout(() => {
                clearInterval(checkSDK);
                if (typeof PlayFab === 'undefined') {
                    statusBadge.innerHTML = "❌ PlayFab SDK failed to load. Check your internet connection.";
                    statusBadge.style.color = "#ff6666";
                }
            }, 5000);
            return;
        }
        
        await testPlayFabConnection();
    }
    
    // Start initialization
    init();
    
    // Retry connection if user clicks status badge (hidden feature)
    statusBadge.style.cursor = "pointer";
    statusBadge.addEventListener('click', () => {
        testPlayFabConnection();
    });
</script>
</body>
</html>
